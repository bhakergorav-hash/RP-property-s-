name: Build RP Propertys APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: ZIP खोलना
        run: |
          mkdir app_project
          unzip -q RP_Propertys_Ready_to_Build.zip -d app_project
          cd app_project
          ls

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: APK बनाना
        run: gradle -p app_project assembleDebug

      - name: APK तैयार रखना
        uses: actions/upload-artifact@v4
        with:
          name: RP-Propertys-APK
          path: app_project/app/build/outputs/apk/debug/app-debug.apk
